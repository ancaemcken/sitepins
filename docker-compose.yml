# One-command local/self-hosted stack: MongoDB + API + web.
#
#   cp api/.env.example api/.env      # fill in secrets + media bucket
#   cp app/.env.example app/.env
#   docker compose up --build
#
# Web:  http://localhost:7000
# API:  http://localhost:4000  (health: /healthz)
#
# Media storage (S3-compatible) still has to be configured in api/.env —
# see the README. MongoDB runs in the `mongo` service below.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Run as a single-node replica set so the better-auth adapter can use
    # transactions (required for atomic user/session creation).
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot init: bootstraps the single-node replica set the first time.
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      [
        "mongosh",
        "--host",
        "mongo",
        "--eval",
        "try { rs.status() } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }"
      ]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - api/.env
    environment:
      # Point the API at the compose Mongo unless api/.env overrides it.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/sitepins?replicaSet=rs0}
      NODE_ENV: production
      PORT: "4000"
      # Allow the web service origin for CORS.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:7000}
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_HP_WS_URL: ${NEXT_PUBLIC_HP_WS_URL:-ws://localhost:4000/api/v1/editor/collab}
        NEXT_PUBLIC_BUCKET_URL: ${NEXT_PUBLIC_BUCKET_URL:-}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Sitepins}
        NEXT_PUBLIC_BRAND_URL: ${NEXT_PUBLIC_BRAND_URL:-https://sitepins.com}
        NEXT_PUBLIC_GITHUB_APP_NAME: ${NEXT_PUBLIC_GITHUB_APP_NAME:-}
        NEXT_PUBLIC_GITLAB_APP_NAME: ${NEXT_PUBLIC_GITLAB_APP_NAME:-}
    restart: unless-stopped
    env_file:
      - app/.env
    environment:
      # Server-side fetches use the Docker service name, not localhost.
      INTERNAL_API_URL: http://api:4000/api/v1
    depends_on:
      - api
    ports:
      - "7000:7000"

volumes:
  mongo-data:
